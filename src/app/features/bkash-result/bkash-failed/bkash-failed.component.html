<div class="d-flex flex-column flex-root">
  <div class="d-flex flex-column flex-center flex-column-fluid py-10 px-4 px-sm-6">
    <div class="card shadow-sm p-6 p-sm-10" style="max-width: 520px; width: 100%;">

      <!--begin::Loading-->
      <div *ngIf="isLoading" class="text-center py-10">
        <span class="spinner-border text-danger" role="status"></span>
        <div class="text-muted fs-7 mt-3">Checking payment status…</div>
      </div>
      <!--end::Loading-->

      <ng-container *ngIf="!isLoading">
        <!--begin::Icon + Title-->
        <div class="text-center mb-6">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light-danger mb-4" style="width:88px;height:88px;">
            <i class="bi bi-x-circle-fill text-danger" style="font-size: 3rem;"></i>
          </div>
          <h2 class="fw-bold text-gray-800 mb-2">Payment Failed</h2>
          <!-- Exact bKash/API error message when available — never a generic line in that case. -->
          <p class="text-gray-600 fs-6 mb-0">
            {{ result?.failureReason || 'Your payment could not be completed. Please try again or contact support.' }}
          </p>
        </div>
        <!--end::Icon + Title-->

        <!--begin::Details (only fields that are actually available)-->
        <div *ngIf="result && (result.orderNumber || result.amount || result.transactionId)"
          class="rounded-2 border mb-6 px-5 py-2" style="background:#f9fafb;">
          <div class="d-flex justify-content-between align-items-center py-3" *ngIf="result.orderNumber">
            <span class="text-muted fs-7">Order Number</span>
            <span class="fw-bold text-gray-800 fs-7">{{ result.orderNumber }}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-3 border-top" *ngIf="result.amount">
            <span class="text-muted fs-7">Amount</span>
            <span class="fw-bold text-gray-800 fs-6">৳{{ result.amount | number:'1.0-2' }}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-3 border-top" *ngIf="result.transactionId">
            <span class="text-muted fs-7">Payment Reference</span>
            <span class="fw-semibold text-gray-800 fs-7 text-break text-end ms-3">{{ result.transactionId }}</span>
          </div>
        </div>
        <!--end::Details-->

        <!--begin::Actions-->
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
          <button type="button" class="btn btn-danger" (click)="tryAgain()">
            <i class="bi bi-arrow-repeat me-2"></i>Try Again
          </button>
          <button type="button" class="btn btn-light" (click)="viewOrders()">
            <i class="bi bi-bag-check me-2"></i>View My Orders
          </button>
        </div>
        <!--end::Actions-->
      </ng-container>

    </div>
  </div>
</div>
