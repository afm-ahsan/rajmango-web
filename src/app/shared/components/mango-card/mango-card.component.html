<div class="card mango-card h-100 border-0 shadow-sm">
  <!-- Image -->
  <a href="javascript:void(0)" class="image-link" (click)="openOrderModal()">
    <img [src]="mango.image" class="card-img-top" [alt]="mango.name"
         (error)="$any($event.target).src='assets/media/avatars/blank.png'" />
  </a>

  <div class="card-body d-flex flex-column px-4 pt-3 pb-4">
    <!-- Name + status badge -->
    <div class="d-flex align-items-start justify-content-between mb-2">
      <h5 class="card-title mb-0 me-2 text-dark fw-bold">{{ mango.name }}</h5>
      <span class="badge flex-shrink-0" [ngClass]="mango.statusBadgeClass || 'badge-light-dark'">
        {{ mango.availabilityLabel || 'Not Listed' }}
      </span>
    </div>

    <!-- Price -->
    <div class="mb-2">
      <span *ngIf="mango.price" class="mango-price fs-3 fw-bolder text-success">
        ৳{{ mango.price | number:'1.0-0' }}<span class="fs-7 fw-semibold text-success">/kg</span>
      </span>
      <span *ngIf="!mango.price" class="fs-6 text-muted fst-italic">Price TBD</span>
    </div>

    <!-- Dates -->
    <div class="d-flex flex-wrap gap-2 mb-2" *ngIf="mango.startDate || mango.endDate">
      <span *ngIf="mango.startDate" class="mango-date-chip badge badge-light-primary">
        <i class="bi bi-calendar-check me-1"></i>From {{ mango.startDate | safeDate | date:'dd MMM yyyy' }}
      </span>
      <span *ngIf="mango.endDate" class="mango-date-chip badge badge-light-warning">
        <i class="bi bi-calendar-x me-1"></i>Until {{ mango.endDate | safeDate | date:'dd MMM yyyy' }}
      </span>
    </div>

    <!-- Sweetness -->
    <div class="mb-2">
      <span class="fs-8 text-muted text-uppercase fw-semibold letter-spacing-1">Sweetness</span>
      <div class="d-flex align-items-center gap-2 mt-1">
        <div class="progress flex-grow-1" style="height: 6px; border-radius: 3px;">
          <div class="progress-bar bg-warning" role="progressbar" [style.width]="getSweetnessWidth(mango.sweetness)"></div>
        </div>
        <span class="fs-8 text-muted fw-semibold">{{ mango.sweetness }}</span>
      </div>
    </div>

    <!-- Region -->
    <p *ngIf="mango.region" class="fs-8 text-muted mb-0 mt-auto pt-2">
      <i class="bi bi-geo-alt me-1"></i>{{ mango.region }}
    </p>

    <!-- Action buttons -->
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-sm btn-outline-primary flex-fill" (click)="openOrderModal()">
        <i class="bi bi-eye me-1"></i>View Detail
      </button>
      <button class="btn btn-sm btn-primary flex-fill" (click)="openQuickOrder()" [disabled]="!mango.isAvailable">
        <i class="bi bi-cart-plus me-1"></i>Order Now
      </button>
    </div>
  </div>
</div>
