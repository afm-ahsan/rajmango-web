<!-- Header -->
<div class="d-flex flex-column bgi-no-repeat rounded-top"
     [style.background-image]="'url(./assets/media/misc/pattern-1.jpg)'">
  <div class="d-flex align-items-center justify-content-between px-9 mt-6 mb-4">
    <h3 class="text-white fw-bold mb-0">
      Notifications
      <span *ngIf="unreadCount > 0" class="badge badge-light fs-8 ms-2">{{ unreadCount }} unread</span>
    </h3>
    <button *ngIf="unreadCount > 0"
            class="btn btn-sm btn-light-warning py-1 px-3 fs-8"
            [disabled]="isMarkingAll"
            (click)="markAllAsRead()">
      Mark all read
    </button>
  </div>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="d-flex justify-content-center align-items-center py-8">
  <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
</div>

<!-- Notification list -->
<div *ngIf="!isLoading" class="scroll-y mh-300px">
  <!-- Empty -->
  <div *ngIf="notifications.length === 0"
       class="d-flex flex-column align-items-center justify-content-center py-8 text-muted fs-7">
    <i class="bi bi-bell-slash fs-3 mb-2"></i>
    No notifications yet
  </div>

  <!-- Items -->
  <div *ngFor="let n of notifications"
       class="d-flex align-items-start px-8 py-3 border-bottom cursor-pointer notification-item"
       [class.bg-light-warning]="!n.isRead"
       (click)="markAsRead(n)">

    <!-- Type icon -->
    <div class="symbol symbol-35px me-3 flex-shrink-0">
      <span class="symbol-label"
            [class.bg-light-primary]="n.notificationType === 1"
            [class.bg-light-success]="n.notificationType === 2"
            [class.bg-light-info]="n.notificationType === 3"
            [class.bg-light-warning]="n.notificationType === 4">
        <i class="fs-5"
           [class.bi-bag-check]="n.notificationType === 1"
           [class.bi-credit-card]="n.notificationType === 2"
           [class.bi-truck]="n.notificationType === 3"
           [class.bi-calendar-check]="n.notificationType === 4"></i>
      </span>
    </div>

    <!-- Content -->
    <div class="flex-grow-1 overflow-hidden">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <span class="fw-bold fs-7 text-dark text-truncate" style="max-width: 210px;">{{ n.title }}</span>
        <span class="text-muted fs-8 flex-shrink-0 ms-2">{{ timeAgo(n.createdAt) }}</span>
      </div>
      <p class="text-muted fs-8 mb-0 text-truncate">{{ n.message }}</p>
      <span *ngIf="n.orderNumber" class="badge badge-light-primary fs-9 mt-1">{{ n.orderNumber }}</span>
    </div>

    <!-- Unread dot -->
    <span *ngIf="!n.isRead"
          class="bullet bullet-dot bg-warning h-6px w-6px ms-2 mt-2 flex-shrink-0"></span>
  </div>
</div>

<!-- Footer -->
<div class="py-3 text-center border-top">
  <button class="btn btn-sm btn-color-gray-600 btn-active-color-primary" (click)="viewAll()">
    View All
    <i class="bi bi-arrow-right ms-1"></i>
  </button>
</div>
